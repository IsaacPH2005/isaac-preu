# ─── Producción (VPS) ─────────────────────────────────────────────────
# Solo búsqueda: no se pueden subir, reprocesar ni borrar documentos, no hay claves
# de IA, el PDF original no se publica y nada queda expuesto salvo vía nginx/Caddy.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml build
#   bash scripts/import.sh export        # primera vez: carga el banco y arranca todo
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Requiere Docker Compose ≥ 2.24 (por las etiquetas !reset / !override).
services:
  backend:
    environment:
      ALLOW_UPLOADS: "false"
      EXPOSE_PDF: "false"
      # Ninguna clave de IA en producción, aunque existan en el .env del servidor.
      GEMINI_API_KEY: ""
      GEMINI_API_KEYS: ""
      OPENROUTER_API_KEY: ""
      NVIDIA_API_KEY: ""
      CORS_ORIGINS: https://${DOMAIN:?Define DOMAIN en .env}
    ports: !reset []
    volumes: !override
      # Solo lectura: ni la app ni un atacante pueden alterar las imágenes.
      - storage:/storage:ro

  frontend:
    ports: !reset []

  # Sin subidas no hace falta el worker (solo arranca con --profile ingest).
  worker:
    profiles: ["ingest"]

  # Por defecto (VPS con nginx existente en 80/443): Caddy sirve HTTP solo en
  # 127.0.0.1:8085 y nginx hace de puerta de entrada con HTTPS (certbot).
  # Ver deploy/nginx/. Para un VPS sin nginx, en .env:
  #   CADDY_SITE_ADDRESS=isaacpreu.pulsarsrl.cloud  CADDY_BIND=0.0.0.0  HTTP_PORT=80  HTTPS_PORT=443
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
    ports:
      # 127.0.0.1: Docker se salta ufw, así que nunca publicar estos puertos a internet.
      - "${CADDY_BIND:-127.0.0.1}:${HTTP_PORT:-8085}:80"
      - "${CADDY_BIND:-127.0.0.1}:${HTTPS_PORT:-8445}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  # Utilidad para scripts/import.sh: única vía para escribir en el volumen de imágenes.
  storage-import:
    image: alpine:3.20
    profiles: ["tools"]
    volumes:
      - storage:/storage
    command:
      - sh
      - -c
      - >-
        rm -rf /storage/pages /storage/pdfs &&
        tar -C /storage -xzf - &&
        chmod -R a+rX /storage &&
        echo "Imagenes cargadas: $$(find /storage/pages -name '*.png' | wc -l)"

volumes:
  caddy_data:
  caddy_config: