# nginx del VPS → BancoPreu (Caddy escuchando solo en 127.0.0.1:8085).
#
# Instalación:
#   sudo cp deploy/nginx/isaacpreu.pulsarsrl.cloud.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/isaacpreu.pulsarsrl.cloud.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d isaacpreu.pulsarsrl.cloud --redirect   # añade HTTPS y la redirección
#
# certbot añadirá aquí el bloque "listen 443 ssl" con el certificado.
server {
    listen 80;
    listen [::]:80;
    server_name isaacpreu.pulsarsrl.cloud;

    # Producción es de solo lectura: no se suben archivos.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
