name: bancopreu

x-backend-env: &backend-env
  POSTGRES_USER: ${POSTGRES_USER:-bancopreu}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bancopreu}
  POSTGRES_DB: ${POSTGRES_DB:-bancopreu}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  REDIS_URL: redis://redis:6379/0
  STORAGE_DIR: /storage
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODELS: ${OPENROUTER_MODELS:-}
  OPENROUTER_RPM: ${OPENROUTER_RPM:-16}
  NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
  NVIDIA_MODELS: ${NVIDIA_MODELS:-}
  NVIDIA_RPM: ${NVIDIA_RPM:-30}
  LLM_PROVIDERS: ${LLM_PROVIDERS:-gemini,openrouter,nvidia}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
  GEMINI_CONCURRENCY: ${GEMINI_CONCURRENCY:-4}
  GEMINI_THINKING_BUDGET: ${GEMINI_THINKING_BUDGET:-0}
  GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-low}
  GEMINI_RPM: ${GEMINI_RPM:-0}
  RENDER_DPI: ${RENDER_DPI:-150}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-300}
  CORS_ORIGINS: ${CORS_ORIGINS:-*}
  ALLOW_UPLOADS: ${ALLOW_UPLOADS:-true}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bancopreu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bancopreu}
      POSTGRES_DB: ${POSTGRES_DB:-bancopreu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    image: bancopreu-backend
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    environment: *backend-env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - storage:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

  worker:
    image: bancopreu-backend
    build: ./backend
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=${WORKER_CONCURRENCY:-2}
    environment: *backend-env
    volumes:
      - storage:/storage
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NUXT_BACKEND_URL: http://backend:8000
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  storage:
